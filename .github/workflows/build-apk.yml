yaml
name: 폭탄 피하기 APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java(JDK) 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 의존성 설치
        run: npm install

      - name: 웹 빌드 (Vite)
        run: npm run build

      - name: Capacitor Android 추가
        run: |
          npx cap add android
          npx cap sync android

      - name: Gradle 실행권한
        run: chmod +x android/gradlew

      - name: Debug APK 빌드
        run: |
          cd android
          ./gradlew assembleDebug

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: poktan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
